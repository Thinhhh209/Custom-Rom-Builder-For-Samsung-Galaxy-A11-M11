name: Custom Rom Builder Samsung Galaxy A11/M11

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      GSI:
        description: 'direct link for Gsi image '
        required: true
        default: 'https://sourceforge.net/projects/andyyan-gsi/files/lineage-19.x/lineage-19.1-20230715-UNOFFICIAL-a64_bgN.img.xz'        
      ARCH:
        description: 'ARM64 or ARM32?'
        required: true
        default: '32'                
      NAME:
        description: 'Rom Name'
        required: true
        default: 'LineageOS_19.1_A11_M11_ARM32_Gapps'                

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4  # Đã sửa từ v2 lên v4

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y zip xz-utils unzip p7zip-full wget
        
    - name: Preparing Files
      run: |
        wget -O a11q.zip "https://sourceforge.net/projects/samsung-galaxy-a01-m01/files/a11q.zip" || echo "Không tải được a11q.zip, thử cách khác..."
        git clone https://github.com/abiES76/Custom-Rom-Builder-For-Samsung-Galaxy-A11-M11
        if [ -f a11q.zip ]; then unzip a11q.zip; rm a11q.zip; fi
        # Copy các file cần thiết từ repo đã clone
        cp -r Custom-Rom-Builder-For-Samsung-Galaxy-A11-M11/* ./
        chmod +x *.sh 2>/dev/null || true
        chmod +x bin/* 2>/dev/null || true

    - name: Downloading your GSI
      run: |
        mkdir -p temp
        wget -P "./temp" ${{ github.event.inputs.GSI }} 
        chmod 755 *
        chmod 755 ./bin/* 2>/dev/null || true

    - name: Building
      run: |
        # Thử chạy script arm32 hoặc arm64
        if [ "${{ github.event.inputs.ARCH }}" = "32" ]; then
          if [ -f "./arm32_gsi" ]; then ./arm32_gsi
          elif [ -f "./arm32_git" ]; then ./arm32_git
          else echo "Không tìm thấy script arm32"; exit 1; fi
        else
          if [ -f "./arm64_gsi" ]; then ./arm64_gsi
          elif [ -f "./arm64_git" ]; then ./arm64_git
          else echo "Không tìm thấy script arm64"; exit 1; fi
        fi
        
    - name: Uploading The Zip
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.NAME }}
        path: zip/Custom_Rom_SDM450.zip
